# ==============================================================================
# HackatOhm 2026 — desafio Embrapa | Motor de decisão "o que plantar"
# Fazenda: 600 ha em 3 talhões — Patos de Minas (safra 2026/27)
#
# Regenerado por engine/atualiza_config.py em 26/10/2026 — fontes:
#   · janelas_viveis → REAIS: engine/janelas_zarc.json (ZARC via adequacao.py)
#   · margem/risco   → REAIS: engine/margens_mc.json (MC do M1)
#
# ⚠ AVISO MOCK vs REAL:
#   - janelas_viveis JÁ são reais (ZARC, safra 2026/27). Lista VAZIA = rotação
#     INVIÁVEL naquele grupo de solo (ex.: soja_milho no arenoso — a safrinha
#     não fecha) — a validação do motor aceita (só exige ≥1 grupo viável).
#   - margem_esperada/risco ver o status acima; hipóteses de cada rotação
#     registram a fonte e o método (rastreabilidade).
#
# Unidades (CP-SAT só tem inteiros — nunca float no objetivo):
#   margem_esperada: centavos de R$ por hectare (R$ 4.180/ha → 418000)
#   risco: por-mil (‰) = P(margem < 0) × 10 (12% → 120)
#   janelas_viveis: decêndios 1–36 (dec25–27 = set … dec36 = 21–31 dez);
#     a janela da ROTAÇÃO = decêndios de plantio da 1ª cultura, PAREADA com
#     a 2ª (só entram decêndios que deixam a safrinha caber — ciclo Grupo I).
# ==============================================================================

cenario:
  municipio: "Patos de Minas"
  cod_ibge: 3148004
  safra: "2026/27"
  area_total_ha: 600

settings:
  decendios: 36
  risco_maximo_percent: 40
  margem_em_centavos: true

talhoes:   # gerado do formulário (tela 1); irrigacao: true habilita manejo irrigado (v0 = só sequeiro)
  T1: { area_ha: 300, grupo_solo: 2, irrigacao: false }
  T2: { area_ha: 200, grupo_solo: 1, irrigacao: false }
  T3: { area_ha: 100, grupo_solo: 3, irrigacao: false }

rotacoes:  # coeficientes por rotação — hipóteses citam a fonte de cada número
  soja_milho:
    culturas: ["soja", "milho safrinha"]
    margem_esperada: 449673   # centavos de R$/ha
    risco: 220   # P[margem<0] em por-mil (‰)
    janelas_viveis:   # por grupo de solo — decêndios (ZARC real)
      1: []
      2: [28, 29]
      3: [28, 29, 30]
    hipoteses:
      - { chave: "referencia_preco_prod", valor: "preço SIDRA × produtividade PAM (regime 2026/27)", fonte_url: "https://apisidra.ibge.gov.br/values/t/54", metodo: "margem esperada = preço_ref × prod_ref − custo Conab" }
      - { chave: "volatilidade_historica", valor: "31 anos PAM×SIDRA pareados (1995-2025), rebased na referência", fonte_url: "notebooks/saida_preco/dados_anuais_Patos_de_Minas.csv", metodo: "MC: desvios multiplicativos preço×prod preservando correlação" }
      - { chave: "custo_conab", valor: "custo médio R$/ha Conab 2024-2026 (Cerrado)", fonte_url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/custos-de-producao", metodo: "resumo_custos_para_engine.csv" }
      - { chave: "janelas_zarc", valor: "ZARC 2026/27 — janelas pareadas (ciclo Grupo I)", fonte_url: "https://dados.agricultura.gov.br/dataset/tabua-de-risco-zoneamento-agricola-de-risco-climatico", metodo: "engine/adequacao.py + portaria MAPA" }
      - { chave: "janela_segunda_cultura", valor: "plantio da 2ª cultura — g1: sem janela (inviável) · g2: [2-3] · g3: [2-4]", fonte_url: "https://dados.agricultura.gov.br/dataset/tabua-de-risco-zoneamento-agricola-de-risco-climatico", metodo: "janelas pareadas do ZARC — engine/adequacao.py" }

