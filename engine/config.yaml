# ==============================================================================
# HackatOhm 2026 — desafio Embrapa | Motor de decisão "o que plantar"
# Fazenda: 600 ha em 3 talhões — Patos de Minas (safra 2026/27)
#
# Regenerado por engine/atualiza_config.py em 24/10/2026 — fontes:
#   · janelas_viveis → REAIS: engine/janelas_zarc.json (ZARC via adequacao.py)
#   · custos         → REAIS: Conab série histórica 2026 (D2, pipeline/mercado.py)
#   · margem/risco   → MOCK: engine/margens_mc.json AUSENTE — mantidos (aguardando MC do M1)
#
# ⚠ AVISO MOCK vs REAL:
#   - janelas_viveis JÁ são reais (ZARC, safra 2026/27). Lista VAZIA = rotação
#     INVIÁVEL naquele grupo de solo (ex.: soja_milho no arenoso — a safrinha
#     não fecha) — a validação do motor aceita (só exige ≥1 grupo viável).
#   - custos JÁ são reais (Conab, hipóteses custo_total_* com URL oficial;
#     região-referência Unaí-MG / Rio Verde-GO / Uruçuí-PI como proxy Cerrado).
#   - margem_esperada/risco ainda MOCK: com custo real da rotação soja→milho
#     (R$ 13.962/ha) a margem só sai do Monte Carlo do M1 (fato → MC → margens).
#
# Unidades (CP-SAT só tem inteiros — nunca float no objetivo):
#   margem_esperada: centavos de R$ por hectare (R$ 4.180/ha → 418000)
#   risco: por-mil (‰) = P(margem < 0) × 10 (12% → 120)
#   janelas_viveis: decêndios 1–36 (dec25–27 = set … dec36 = 21–31 dez);
#     a janela da ROTAÇÃO = decêndios de plantio da 1ª cultura, PAREADA com
#     a 2ª (só entram decêndios que deixam a safrinha caber — ciclo Grupo I).
# ==============================================================================

cenario:
  municipio: "Patos de Minas"
  cod_ibge: 3148004
  safra: "2026/27"
  area_total_ha: 600

settings:
  decendios: 36
  risco_maximo_percent: 40
  margem_em_centavos: true

talhoes:   # gerado do formulário (tela 1); irrigacao: true habilita manejo irrigado (v0 = só sequeiro)
  T1: { area_ha: 300, grupo_solo: 2, irrigacao: false }
  T2: { area_ha: 200, grupo_solo: 1, irrigacao: false }
  T3: { area_ha: 100, grupo_solo: 3, irrigacao: false }

rotacoes:  # coeficientes por rotação — hipóteses citam a fonte de cada número
