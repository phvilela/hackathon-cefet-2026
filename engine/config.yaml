      - { chave: "referencia_preco_prod", valor: "preço SIDRA × produtividade PAM (regime 2026/27)", fonte_url: "https://apisidra.ibge.gov.br/values/t/54", metodo: "margem esperada = preço_ref × prod_ref − custo Conab" }
      - { chave: "volatilidade_historica", valor: "31 anos PAM×SIDRA pareados (1995-2025), rebased na referência", fonte_url: "notebooks/saida_preco/dados_anuais_Patos_de_Minas.csv", metodo: "MC: desvios multiplicativos preço×prod preservando correlação" }
      - { chave: "custo_conab", valor: "custo médio R$/ha Conab 2024-2026 (Cerrado)", fonte_url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/custos-de-producao", metodo: "resumo_custos_para_engine.csv" }
