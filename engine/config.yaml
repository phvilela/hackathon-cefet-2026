      - { chave: "custo_total_milho_safrinha", valor: "R$ 6.671/ha", fonte_url: "https://www.gov.br/conab/pt-br/atuacao/informacoes-agropecuarias/custos-de-producao/arquivos-custo-de-producao/agricolas/milho/milho_2a_safra_serie_historica_2005-2026.xls", metodo: "Conab série histórica, Unaí-MG, 2026" }
