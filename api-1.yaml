components:
  schemas:
    ValidationErrorResponse:
      type: object
      properties:
        violations:
          type: array
          items:
            $ref: "#/components/schemas/Violation"
        errorCode:
          type: integer
          format: int32
        errorLabel:
          type: string
    Violation:
      type: object
      properties:
        fieldName:
          type: string
        message:
          type: string
    ItemSubscriptionRequest:
      type: object
      description: Represents a request to manage item subscriptions.
      properties:
        userIds:
          type: array
          description: List of user IDs to process.
          example:
            - 1
            - 2
            - 3
          items:
            type: integer
            format: int64
        teamIds:
          type: array
          description: List of team IDs to process.
          example:
            - 10
            - 11
          items:
            type: integer
            format: int64
    ItemFileUpdateRequest:
      type: object
      description: Represents item file update request.
      properties:
        name:
          type: string
          description: The new name for the file. You may include or omit the extension;
            the system will preserve the original file type regardless.
          maxLength: 255
          minLength: 1
        description:
          type: string
          description: Represents item file description.
          maxLength: 255
          minLength: 0
      required:
        - name
    ItemFileResponse:
      type: object
      description: Represents item file response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique item file identifier across the system.
        name:
          type: string
          description: Represents item file name.
        description:
          type: string
          description: Represents item file description.
        size:
          type: integer
          format: int64
          description: Represents item file size in bytes.
        extension:
          type: string
          description: Represents item file extension.
          example: pdf
        fileType:
          type: string
          description: Represents item file type.
          example: PDF
        uploadedBy:
          type: integer
          format: int64
          description: Represents ID of the user who uploaded the file.
        createdAt:
          type: string
          format: date-time
          description: Represents date and time of the file upload (UTC) in ISO-8601 format.
    CommentRequest:
      type: object
      description: Represents item comment request.
      properties:
        text:
          type: string
          description: Represents text of the comment.
          example: My comment.
          minLength: 1
        repliesToId:
          type: integer
          format: int64
          description: Represents comment ID to reply to.
          example: 1
      required:
        - text
    CommentResponse:
      type: object
      description: Represents item comment response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique item comment identifier across the system.
        content:
          type: string
          description: Represents content of the comment.
        deleted:
          type: boolean
          description: Indicates whether the comment is softly deleted.
        createdBy:
          type: integer
          format: int64
          description: Represents ID of the user who created the comment.
        createdAt:
          type: string
          format: date-time
          description: Represents date and time of the comment creation (UTC) in ISO-8601
            format.
        updatedAt:
          type: string
          format: date-time
          description: Represents date and time of the comment update (UTC) in ISO-8601
            format.
        pinned:
          type: boolean
          description: Indicates whether the comment is pinned.
        reactions:
          type: array
          description: Represents reactions to the comment.
          items:
            $ref: "#/components/schemas/ReactionResponse"
        replies:
          type: array
          description: Represents replies to the comment.
          items:
            $ref: "#/components/schemas/CommentResponse"
    ReactionDetails:
      type: object
      description: Represents user reaction details.
      properties:
        userId:
          type: integer
          format: int64
          description: Represents unique user identifier accross the system.
        reactedAt:
          type: string
          format: date-time
          description: Represents date and time of the comment reaction creation (UTC) in
            ISO-8601 format.
    ReactionResponse:
      type: object
      description: Represents detailed comment reaction response.
      properties:
        reactionCode:
          type: string
          description: >
            Represents the string code of the emoji. For example, for thumbs up
            emoji, we have "1f44d" code.
        reactedUsers:
          type: array
          description: Represents a list of users who left the comment reaction.
          items:
            $ref: "#/components/schemas/ReactionDetails"
    Reaction:
      type: object
      properties:
        value:
          type: string
          description: >
            A code representing an emoji, like "1f44d" (thumbs up) or "2705"
            (checkmark button).

            You'll see there are variations on how an emoji could be
            represented, we need a unicode representation

            without "U+" prefix. For example, the unicode for "thumbs up" is
            "U+1F44D", so take it after the plus

            sign (letter case doesn't matter).
          example: 1f44d
          minLength: 1
      required:
        - value
    ReactionPutRequest:
      type: object
      description: Represents request for adding/removing authenticated user's comment
        reaction(s).
      properties:
        reactions:
          type: array
          description: >
            You can leave multiple reactions, it's overriding the current ones
            that you've left,

            leave empty to remove them.
          items:
            $ref: "#/components/schemas/Reaction"
          uniqueItems: true
      required:
        - reactions
    ReactionPutResponse:
      type: object
      description: Represents response on reaction(s) change.
      properties:
        reactions:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/ReactionResponseNoCode"
          description: >
            A map containing reaction code as a key and the list of reactions
            without code

            (ReactionResponseNoCode) as a value.
    ReactionResponseNoCode:
      type: object
      description: Represents item comment reaction response without reaction code.
      properties:
        createdById:
          type: integer
          format: int64
          description: Represents ID of the user who created the comment reaction.
        createdAt:
          type: string
          format: date-time
          description: Represents date and time of the comment reaction creation (UTC) in
            ISO-8601 format.
    ItemGroupUpdateRequest:
      type: object
      properties:
        title:
          type: string
          description: Represents title of the item group.
          maxLength: 255
          minLength: 1
        ranking:
          type: string
          description: Represents lexicographical string used for custom ordering/sorting.
          minLength: 1
        color:
          type: string
          description: Represents color of the item group. Color value must be in standard
            RGB hexadecimal format.
      required:
        - ranking
        - title
    ItemGroupResponse:
      type: object
      description: Represents item group response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique item group identifier across the system.
        title:
          type: string
          description: Represents title of the item group.
        color:
          type: string
          description: Represents color of the item group. Color value is in standard RGB
            hexadecimal format.
        ranking:
          type: string
          description: Represents lexicographical string used for custom ordering/sorting.
    ItemCreateRequest:
      type: object
      description: Represents item create request.
      properties:
        title:
          type: string
          description: >-
            Represents title of the item. If it is not provided then default
            title be set. Default title for item is New Item and

            for subitem it is New Subitem.
          example: My New Item
          maxLength: 255
        parentId:
          type: integer
          format: int64
          description: >-
            Represents ID of the parent under which subitem is created. If it
            has null value then item is created, if

            it is specified then subitem is created under specified parent.
          example: 1
        groupId:
          type: integer
          format: int64
          description: >-
            Represents ID of the item group in which item is created. If it is
            not specified then **groupTitle** field

            will be used for determining in which group item is created.
          example: 1
        groupTitle:
          type: string
          description: >-
            Represents title of the item group in which item is created. If
            neither **groupId** nor **groupTitle** field is

            not specified then item will be created in the first group in the
            board.
          example: Backlog
        subscribedUserIds:
          type: array
          description: Represents list of configured user ids which should be added as
            subscribers to the new item. If omitted, default subscription logic
            applies (creator + template defaults).
          example:
            - 1
            - 2
          items:
            type: integer
            format: int64
        subscribedTeamIds:
          type: array
          description: Represents list of configured team ids which should be added as
            subscribers to the new item.
          example:
            - 1
          items:
            type: integer
            format: int64
        fields:
          type: object
          additionalProperties: {}
          description: >
            Represents item field values added to the item. If it is omitted
            then item will be created with default values. Field can be

            specified by it's key or by it's title. Field value differs per type
            and for some types it can be specified in multiple ways.


            | Type | Examples (Key / Title) |

            | :--- | :--- |

            | **String** | `{"string-1" : "test"}` <br> `{"String Field Title" :
            "test"}` |

            | **Rich Text** | `{"rich_text-1" : "some rich text"}` <br>
            `{"Description" : "some rich text"}` |

            | **Number** | `{"number-1" : 13.4}` <br> `{"Price" : 13.4}` |

            | **Date** | `{"date_time-1" : "2017-06-02T18:10:15.254Z"}` <br>
            `{"Date" : "2017-06-02T18:10:15.254Z"}` |

            | **Timeline** | `{"timeline-1" : {"start" :
            "2026-01-02T18:10:15.254Z", "end": "2026-02-02T18:10:15.254Z"}}`
            <br> `{"Timeline" : {"start" : "2026-01-02T18:10:15.254Z", "end":
            "2026-02-02T18:10:15.254Z"}}` |

            | **Status** | `{"status-1" : "1"}`, `{"status-1" : "To do"}` <br>
            `{"Status" : "1"}`, `{"Status" : "To do"}` |

            | **Tag** | `{"tag-1" : ["1", "2"]}`, `{"tag-1" : ["Product",
            "HR"]}` <br> `{"Department" : ["1", "2"]}`, `{"Department" :
            ["Product", "HR"]}` |

            | **Link** | `{"link-1" : "https://www.google.com"}` <br> `{"link-1"
            : {"url" : "https://www.google.com", "displayText" : "Google"}}`
            <br> `{"Link" : "https://www.google.com"}` |

            | **Person** | `{"person-1": {"users" : [{"id" : "1"}, {"email" :
            "test@gmail.com"}], "teams": [{"id" : 1}, {"title" : "Backend
            Team"}]}}` <br> `{"Assignee": {"users" : [{"id" : "1"}, {"email" :
            "test@gmail.com"}], "teams": [{"id" : 1}, {"title" : "Backend
            Team"}]}}` |
          example:
            Status: To do
            number-1: 50
            Description: Test description
    BoardDefaultValues:
