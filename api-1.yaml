            format: int64
        subscribedTeamIds:
          type: array
          description: Represents list of configured team ids which are by default added
            as subscribers to the new item in the board.
          items:
            type: integer
            format: int64
        defaultAttributes:
          type: object
          additionalProperties: {}
          description: >-
            Represents configured default attribute values applied to new items
            created on this board.

            "The keys are unique attribute keys, and the values are the default
            data for that attribute.
          example:
            status-1: "1"
            tag-1:
              - "1"
              - "2"
    BoardResponse:
      type: object
      description: Represents board response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique identifier of the board.
        title:
          type: string
          description: Represents title of the board.
        description:
          type: string
          description: Represents description of the board.
        defaultBoard:
          type: boolean
          description: Indicates if the board is default.
        template:
          type: boolean
          description: If true, it means the board serves as a template for generating
            other production-ready boards.
        ranking:
          type: string
          description: Represents lexicographical string used for the board ordering.
        kind:
          type: string
          description: Represents type of the board.
          enum:
