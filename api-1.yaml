            - PRIVATE
        editPermissionsMode:
          type: string
          description: Represents permission modes for the board edit actions.
          enum:
            - EVERYTHING
            - CONTENT
            - UPDATES
        folder:
          description: Represents folder containing the board. Can be returned as an ID or
            a full object if expanded.
          oneOf:
            - $ref: "#/components/schemas/FolderResponse"
            - type: integer
              format: int64
        space:
          description: Represents space containing the board. Can be returned as an ID or
            a full object if expanded.
          oneOf:
            - $ref: "#/components/schemas/SpaceResponse"
            - type: integer
              format: int64
        defaultValues:
          $ref: "#/components/schemas/BoardDefaultValues"
          description: Represents configured default values used when creating new item.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/ItemAttributeDefinition"
            description: Represents list of item field definitions present in the board.
        groups:
          type: array
          items:
            $ref: "#/components/schemas/ItemGroupResponse"
            description: Represents list of item group definitions present in the board.
    DateTimeConfiguration:
      allOf:
        - $ref: "#/components/schemas/ItemAttributeConfiguration"
        - type: object
          properties:
            showCurrentYear:
              type: boolean
              description: Represents whether the year in the date format is displayed.
            showDayOfTheWeek:
              type: boolean
              description: Represents whether the name of the day is displayed.
            showWeekNumbers:
              type: boolean
              description: Represents whether week number is displayed.
            alwaysKeepAddTimeOn:
              type: boolean
              description: Represents whether the time component is displayed.
      description: Represents configuration for date-time attribute.
    FolderResponse:
      type: object
      description: Represents folder response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique folder identifier across the system.
        title:
          type: string
          description: Represents title of the item group.
        ranking:
          type: string
          description: Represents lexicographical string used for ordering.
    ItemAttributeConfiguration: {}
    ItemAttributeDefinition:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique identifier of the item attribute.
        name:
          type: string
          description: Represents name of the item attribute.
        description:
          type: string
          description: Represents description of the item attribute.
        key:
          type: string
          description: Represents key of the item attribute.
        type:
          type: string
          description: Represents type of the item attribute.
          enum:
            - STRING
            - NUMBER
            - DATE_TIME
            - STATUS
            - TAG
            - PERSON
            - RICH_TEXT
            - LINK
            - TIMELINE
        configuration:
          description: Represents configuration of the item attribute.
          oneOf:
            - $ref: "#/components/schemas/DateTimeConfiguration"
            - $ref: "#/components/schemas/NoConfiguration"
            - $ref: "#/components/schemas/NumberConfiguration"
            - $ref: "#/components/schemas/PersonConfiguration"
            - $ref: "#/components/schemas/StatusConfiguration"
            - $ref: "#/components/schemas/TagConfiguration"
            - $ref: "#/components/schemas/TimelineConfiguration"
    ItemFieldResponse:
      type: object
      description: Represents item field response.
      properties:
        key:
          type: string
          description: Represents key of the item field.
          examples:
            - status-1
            - tag-1
            - person-1
        type:
          type: string
          description: Represents type of the item field.
          enum:
            - STRING
            - NUMBER
            - DATE_TIME
            - STATUS
            - TAG
            - PERSON
            - RICH_TEXT
            - TIMELINE
            - LINK
        title:
          type: string
          description: Represents title of the item field.
        value:
          description: >
            Represents the value of an item field. This field is **expandable**.

            By default, it returns a **Short** version (primitive/simple ID).

            If expanded, it returns a **Full** version (object with metadata).


            ### Value Mapping Table


            | Field Type | Short Version (Default) | Full Version (Expanded) |

            | :--- | :--- | :--- |

            | **Text** | `string` | `string` |

            | **Number** | `number` | `number` |

            | **Date** | `string` (ISO 8601) | `string` (ISO 8601) |

            | **Status** | `string` (key) | `object` (key, label, color) |

            | **Tag** | `array<string>` (keys) | `array<object>` (key, label,
            color) |

            | **Link** | `object` (url, displayText) | `object` (url,
            displayText) |

            | **Timeline** | `object` (start, end) | `object` (start, end) |

            | **Person** | `object` (assigned IDs) | `object` (full User/Team
            objects) |
    ItemResponse:
      type: object
      description: Represents extendable item response.
      properties:
        id:
          type: integer
          format: int64
          description: Represents unique item identifier across the system.
        title:
          type: string
          description: Represents item title.
        ranking:
          type: string
          description: Represents item ranking.
        createdAt:
          type: string
          format: date-time
          description: Represents date and time of the item creation (UTC) in ISO-8601
            format.
        deletedAt:
          type: string
          format: date-time
          description: Represents date and time of the item soft deletion (UTC) in
            ISO-8601 format.
        archived:
          type: boolean
          description: Indicates whether the item is archived.
        deleted:
          type: boolean
          description: Indicates whether the item is softly deleted.
        commentCount:
          type: integer
          format: int32
          description: Represents number of comments added on the item.
        fileCount:
          type: integer
          format: int32
          description: Represents number of files uploaded on the item.
        createdBy:
          description: Represents ID of the user who created the item, it can be expanded
            to retrieve full user details.
          oneOf:
            - $ref: "#/components/schemas/ShortUserResponse"
            - type: integer
              format: int64
        group:
          description: Represents ID of the group in which item is created, it can be
            expanded to include full group details.
          oneOf:
            - $ref: "#/components/schemas/ItemGroupResponse"
            - type: integer
              format: int64
        board:
          description: Represents ID of the board in which item is created, it can be
            expanded to include full board details.
          oneOf:
            - $ref: "#/components/schemas/BoardResponse"
            - type: integer
              format: int64
        space:
          description: Represents ID of the space in which item is created, it can be
            expanded to include full space details
          oneOf:
            - $ref: "#/components/schemas/SpaceResponse"
            - type: integer
              format: int64
        parent:
          description: Represents ID of the parent for subitem, it can be expanded to
            include full item details. It is non-null only for subitems.
          oneOf:
            - $ref: "#/components/schemas/ItemResponse"
            - type: integer
              format: int64
        fields:
          type: array
          description: >
            Represents list of the item fields present on the item. In default
            response values for status, tag and person

            fields are simple IDs. Response can be expanded to include full
            details for status, tag and person fields.
          items:
            $ref: "#/components/schemas/ItemFieldResponse"
        subscribedUsers:
          type: array
          items:
            description: Represents list of subscribed user ids to the item, it can be
              expanded to include full user details.
            oneOf:
              - $ref: "#/components/schemas/ShortUserResponse"
              - type: integer
                format: int64
        subscribedTeams:
          type: array
          items:
            description: Represents list of subscribed team ids to the item, it can be
              expanded to include full team details.
            oneOf:
              - $ref: "#/components/schemas/TeamShortResponse"
              - type: integer
                format: int64
        subitems:
          type: array
          items:
            $ref: "#/components/schemas/ItemResponse"
            description: Represents list of subitems.
    NoConfiguration:
